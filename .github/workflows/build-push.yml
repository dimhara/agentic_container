name: Build and Push Decoupled Agent Sandbox

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE_NAME: ${{ github.repository_owner }}/agentic-sandbox
  VNC_AGENT_IMAGE_NAME: ${{ github.repository_owner }}/agentic-vnc-sandbox
  ANDROID_IMAGE_NAME: ${{ github.repository_owner }}/agentic-android
  SERVER_IMAGE_NAME: ${{ github.repository_owner }}/llama-vulkan-server
  HF_IMAGE_NAME: ${{ github.repository_owner }}/hf-base
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    name: Native Podman Build and Push
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Lowercase the Image Names
        run: |
          echo "AGENT_IMAGE_NAME=${AGENT_IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "VNC_AGENT_IMAGE_NAME=${VNC_AGENT_IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "ANDROID_IMAGE_NAME=${ANDROID_IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "SERVER_IMAGE_NAME=${SERVER_IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "HF_IMAGE_NAME=${HF_IMAGE_NAME,,}" >> ${GITHUB_ENV}

      - name: Build Inference Server Image
        run: |
          podman build \
            -t ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.SERVER_IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.server .

      - name: 1. Build Base Agent Sandbox
        run: |
          CUTOFF_DATE="1 week"
          podman build \
            --build-arg CUTOFF_DATE="$CUTOFF_DATE" \
            -t ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.AGENT_IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.agent .

      - name: 2. Build VNC Agent Sandbox
        run: |
          podman build \
            -t ${{ env.REGISTRY }}/${{ env.VNC_AGENT_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.VNC_AGENT_IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.vncagent .

      - name: 3. Build Android Development Sandbox
        run: |
          podman build \
            -t ${{ env.REGISTRY }}/${{ env.ANDROID_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.ANDROID_IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.android .

      - name: Build HF Base Image
        run: |
          CUTOFF_DATE="1 week"
          podman build \
            --build-arg TARGET_DEVICE="cpu" --build-arg CUTOFF_DATE="$CUTOFF_DATE" \
            -t ${{ env.REGISTRY }}/${{ env.HF_IMAGE_NAME }}:latest \
            -t ${{ env.REGISTRY }}/${{ env.HF_IMAGE_NAME }}:${{ github.sha }} \
            -f Containerfile.hf .

      - name: Log in to GitHub Container Registry (GHCR)
        run: |
          podman login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} \
            -p ${{ secrets.GITHUB_TOKEN }}

      - name: Push All Images to GHCR
        run: |
          for IMG in SERVER_IMAGE_NAME AGENT_IMAGE_NAME VNC_AGENT_IMAGE_NAME ANDROID_IMAGE_NAME HF_IMAGE_NAME; do
            NAME=${!IMG}
            podman push ${{ env.REGISTRY }}/$NAME:latest
            podman push ${{ env.REGISTRY }}/$NAME:${{ github.sha }}
          done
          
      - name: Print resulting image info
        run: |
          echo "✅ All 4 images successfully built and pushed!"
          echo "📦 Android Sandbox: podman pull ${{ env.REGISTRY }}/${{ env.ANDROID_IMAGE_NAME }}:latest"

